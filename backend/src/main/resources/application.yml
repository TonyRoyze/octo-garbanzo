spring:
  application:
    name: reciptile-api
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:reciptile}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed:
    enabled: ${SEED_DATA:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    location: ${ADMIN_LOCATION:}
  jwt:
    secret: ${JWT_SECRET}
    hours: ${JWT_HOURS:8}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploadthing:
    token: ${UPLOADTHING_TOKEN:}
    max-image-bytes: ${UPLOADTHING_MAX_IMAGE_BYTES:5242880}
